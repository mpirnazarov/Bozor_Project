# Alembic configuration — O'rikzor v2
# DB URL kod ichida (env.py) settings'dan olinadi, shu yerda qoldirilmaydi.

[alembic]
script_location = alembic
prepend_sys_path = .
# Migration fayl nomi: 0001_users.py ko'rinishida
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url env.py ichida settings.DATABASE_URL dan o'rnatiladi.
sqlalchemy.url =

[post_write_hooks]
hooks = black,ruff
black.type = console_scripts
black.entrypoint = black
black.options = -l 100 REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
